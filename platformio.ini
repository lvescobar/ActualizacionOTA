[env]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
    bblanchon/ArduinoJson@^7

[env:v100]
build_flags = -DFW_VERSION=\"1.0.0\" -DLED_MODE=0   ; rojo fijo

[env:v110]
build_flags = -DFW_VERSION=\"1.1.0\" -DLED_MODE=1   ; amarillo parpadeando lento

[env:v120]
build_flags = -DFW_VERSION=\"1.2.0\" -DLED_MODE=2   ; rojo + amarillo fijos + IA

[env:v130]   ; versión "mala" para probar el rollback
build_flags = -DFW_VERSION=\"1.3.0\" -DLED_MODE=1 -DSIMULAR_FALLO